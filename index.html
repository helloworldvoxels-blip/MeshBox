<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MESHBOX - Download Game</title>
    <style>
        body {
            background-color: #FFFFFF;
            color: #000000;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        h1 {
            font-size: 4rem;
            margin-bottom: 10px;
            font-weight: 900;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.3rem;
            color: #000000;
            margin-bottom: 50px;
        }
        .download-btn {
            background-color: #FFFF00;
            color: #000000;
            padding: 20px 40px;
            font-size: 2rem;
            font-weight: bold;
            text-decoration: none;
            border: 6px solid #FF0000;
            display: inline-block;
        }
        .download-btn:hover {
            background-color: #FF0000;
            color: #FFFFFF;
        }
    </style>
</head>
<body>

    <!-- Each letter is wrapped so JavaScript can color them individually -->
    <h1>
        <span class="letter">M</span><span class="letter">E</span><span class="letter">S</span><span class="letter">H</span><span class="letter">B</span><span class="letter">O</span><span class="letter">X</span>
    </h1>
    <p>GET DA GAME!!!!</p>
    
    <!-- Updated to point directly to your installer file -->
    <a href="MeshBox_Installer.exe" class="download-btn" download>DOWNLOAD RN!!</a>

    <script>
        // Array of bright colors (Red, Orange, Yellow, Green, Cyan, Blue, Purple, Pink)
        const colors = ["#FF0000", "#FFA500", "#FFFF00", "#008000", "#00FFFF", "#0000FF", "#800080", "#FF007F"];
        
        // Grab all letters and assign a random color to each
        const letters = document.querySelectorAll('.letter');
        letters.forEach(letter => {
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            letter.style.color = randomColor;
        });
    </script>

</body>
</html>
